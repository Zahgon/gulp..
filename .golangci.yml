version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gocritic
    - ineffassign
    - unused
    - misspell
    - unconvert
    - bodyclose

  settings:
    revive:
      rules:
        - name: exported
          severity: warning
        - name: package-comments
        - name: var-naming
          arguments:
            - ["BOM", "CLI", "CWD", "JSON", "URI", "URL", "UTF"]
            - []

formatters:
  enable:
    - gofmt
